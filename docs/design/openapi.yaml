openapi: 3.0.3
info:
  title: DojoMart API
  version: 1.0.0
  description: |
    ข้อกำหนด API ของ DojoMart (ระบบร้านค้าออนไลน์สำหรับฝึกทดสอบซอฟต์แวร์)
    เนื้อหาเดียวกับ docs/design/api.md ในรูปแบบที่นำเข้า Postman ได้
    ข้อกำหนดเชิงพฤติกรรมอยู่ใน docs/requirements/PRD-*.md
    จำนวนเงินเป็นสตริงทศนิยม 2 ตำแหน่ง เวลาเป็น ISO 8601 พร้อม +07:00
servers:
  - url: http://localhost:8001
    description: ค่าเริ่มต้น (ปรับได้ด้วย API_PORT ในไฟล์ .env)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Reviews
  - name: Wishlist
  - name: Cart
  - name: Orders
  - name: Inventory
  - name: Manage products
  - name: Manage coupons
  - name: Reports
  - name: Admin
  - name: Utility

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      description: REQ-AUTH-001, REQ-AUTH-002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: REQ-AUTH-003 to REQ-AUTH-005, REQ-AUTH-006
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (revokes the token used)
      description: REQ-AUTH-007
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: REQ-AUTH-008, REQ-AUTH-009
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Profile]
      summary: Get own profile
      description: REQ-PROF-001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Profile]
      summary: Update own profile (display_name, phone for customers)
      description: REQ-PROF-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/me/addresses:
    get:
      tags: [Profile]
      summary: List own addresses (customer)
      description: REQ-PROF-002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Profile]
      summary: Create an address (customer, max 5)
      description: REQ-PROF-002, REQ-PROF-003
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/me/addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Profile]
      summary: Update an address
      description: REQ-PROF-002
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profile]
      summary: Delete an address
      description: REQ-PROF-005
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/me/addresses/{id}/default:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Profile]
      summary: Set an address as the default
      description: REQ-PROF-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/products:
    get:
      tags: [Catalog]
      summary: List active products (public; no sign-in required)
      description: REQ-CAT-001 to REQ-CAT-005
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'ค้นหาในชื่อสินค้า (ไม่แยกตัวพิมพ์)' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: min_price, in: query, schema: { type: string, example: '100.00' } }
        - { name: max_price, in: query, schema: { type: string, example: '200.00' } }
        - name: sort
          in: query
          schema: { type: string, enum: [name_asc, name_desc, price_asc, price_desc], default: name_asc }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Catalog]
      summary: Get product detail (public; no sign-in required)
      description: REQ-CAT-006
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/products/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Reviews]
      summary: List reviews of a product (newest first; public, no sign-in required)
      description: REQ-REV-004
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      summary: Write a review (only after receiving the product)
      description: REQ-REV-001 to REQ-REV-003
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist (newest added first)
      description: REQ-WISH-003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WishlistItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/wishlist/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    put:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      description: REQ-WISH-001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_id: { type: integer }
                  added_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      description: REQ-WISH-002
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cart:
    get:
      tags: [Cart]
      summary: Get the cart with pricing
      description: REQ-CART-010
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add a product to the cart (merges with an existing line)
      description: REQ-CART-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: OK (returns the whole cart)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cart/items/{item_id}:
    parameters:
      - name: item_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Cart]
      summary: Set the quantity of a cart line
      description: REQ-CART-002
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuantityRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: Remove a cart line
      description: REQ-CART-003
      responses:
        '200':
          description: OK (returns the whole cart)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cart/coupon:
    put:
      tags: [Cart]
      summary: Apply a coupon (replaces the current one)
      description: REQ-COUP-002 to REQ-COUP-005
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyCouponRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: Remove the coupon from the cart
      description: REQ-COUP-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orders:
    post:
      tags: [Orders]
      summary: Place an order from the cart
      description: REQ-ORD-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: List own orders (newest first)
      description: REQ-ORD-007
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Orders]
      summary: Get an order (customer own; staff and admin any)
      description: REQ-ORD-007
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Orders]
      summary: Pay for an order (simulated)
      description: REQ-ORD-003
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Orders]
      summary: Cancel an order
      description: REQ-ORD-004, REQ-ORD-005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/orders/{id}/return:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Orders]
      summary: Return a delivered order (within 7 days)
      description: REQ-ORD-006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/manage/orders:
    get:
      tags: [Orders]
      summary: Order queue (staff, admin)
      description: REQ-ORD-008
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'เลขคำสั่งซื้อ (ตรงทั้งค่า) หรือส่วนหนึ่งของ username ลูกค้า' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ManageOrderListItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/manage/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Orders]
      summary: Move an order to PACKED, SHIPPED or DELIVERED (staff, admin)
      description: REQ-ORD-004, REQ-ORD-008
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/manage/inventory:
    get:
      tags: [Inventory]
      summary: Stock list (staff, admin)
      description: REQ-INV-005
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/manage/inventory/adjustments:
    post:
      tags: [Inventory]
      summary: Adjust stock (staff, admin)
      description: REQ-INV-001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/manage/inventory/movements:
    get:
      tags: [Inventory]
      summary: Stock movement history (newest first)
      description: REQ-INV-002
      parameters:
        - { name: product_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/manage/inventory/low-stock:
    get:
      tags: [Inventory]
      summary: Latest low-stock snapshot
      description: REQ-INV-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LowStock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/manage/products:
    get:
      tags: [Manage products]
      summary: List all products including inactive (manager, admin)
      description: REQ-CAT-009
      parameters:
