components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: โทเคนที่ได้จาก POST /api/auth/login
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProductIdPath:
      name: product_id
      in: path
      required: true
      schema: { type: integer }
    JobNamePath:
      name: name
      in: path
      required: true
      schema: { type: string, enum: [cancel-unpaid-orders, hourly-sales-report, low-stock-snapshot] }
    FromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-10-04' }
    ToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-10-10' }
    FromDateTime:
      name: from
      in: query
      required: true
      schema: { type: string, example: '2026-10-10T14:00+07:00' }
    ToDateTime:
      name: to
      in: query
      required: true
      schema: { type: string, example: '2026-10-10T18:00+07:00' }
  responses:
    BadRequest:
      description: Bad request (VALIDATION_ERROR, INVALID_JSON, INVALID_CURRENT_PASSWORD)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized (UNAUTHENTICATED, INVALID_CREDENTIALS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Forbidden (FORBIDDEN, ACCOUNT_DISABLED, PASSWORD_CHANGE_REQUIRED, REVIEW_NOT_ALLOWED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (see the error codes in docs/design/api.md)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: Account temporarily locked (ACCOUNT_LOCKED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            reason: { type: string, description: 'เฉพาะ COUPON_INVALID' }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '1234.50'
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
    Role:
      type: string
      enum: [customer, staff, manager, admin]
    Category:
      type: string
      enum: [Drinkware, Apparel, Stationery, Electronics, Home]
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, PACKED, SHIPPED, DELIVERED, CANCELLED, RETURNED]
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
    RegisterRequest:
      type: object
      required: [username, password, display_name, birthdate]
      properties:
        username: { type: string, example: newbuyer1 }
        password: { type: string, example: Passw0rdA }
        display_name: { type: string, example: New Buyer }
        birthdate: { type: string, format: date, example: '1999-05-20' }
    RegisteredUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: customer1 }
        password: { type: string, example: Customer123 }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 600 }
        must_change_password: { type: boolean }
        user:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            display_name: { type: string }
            role: { $ref: '#/components/schemas/Role' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }
    Me:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        phone: { type: string, nullable: true }
        birthdate: { type: string, format: date, nullable: true }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
    UpdateMeRequest:
      type: object
      properties:
        display_name: { type: string }
        phone: { type: string, nullable: true }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: integer }
            is_default: { type: boolean }
            created_at: { type: string, format: date-time }
    AddressInput:
      type: object
      required: [label, recipient_name, phone, line1, province, postal_code]
      properties:
        label: { type: string }
        recipient_name: { type: string }
        phone: { type: string, example: '0812345678' }
        line1: { type: string }
        line2: { type: string, nullable: true }
        province: { type: string }
        postal_code: { type: string, example: '10110' }
    ProductListItem:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        price: { $ref: '#/components/schemas/Money' }
        stock_status: { $ref: '#/components/schemas/StockStatus' }
        average_rating: { type: string, nullable: true, example: '4.5' }
        review_count: { type: integer }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductListItem'
        - type: object
          properties:
            description: { type: string, nullable: true }
            stock: { type: integer }
            in_wishlist: { type: boolean }
    Review:
      type: object
      properties:
        id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
