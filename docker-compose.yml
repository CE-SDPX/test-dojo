services:
  web:
    build:
      context: ./app/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    environment:
      - API_PORT=${API_PORT:-8001}
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./app
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - DOJO_DB_PATH=/data/dojo.db
    volumes:
      - dojo-data:/data
    restart: unless-stopped

  scheduler:
    build:
      context: ./app
    command: ["python", "-m", "dojo.scheduler"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - DOJO_DB_PATH=/data/dojo.db
    volumes:
      - dojo-data:/data
    depends_on:
      - api
    restart: unless-stopped

  dbview:
    build:
      context: ./app/dbview
    profiles: ["dbview"]
    ports:
      - "127.0.0.1:${DBVIEW_PORT:-8081}:8080"
    volumes:
      - dojo-data:/data
    command: ["--read-only", "/data/dojo.db"]
    restart: unless-stopped

volumes:
  dojo-data:
